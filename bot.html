<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Máy quay trúng thưởng · Orb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080d;
  --panel:#10131c;
  --panel2:#161a26;
  --line:rgba(255,255,255,.08);
  --line2:rgba(255,255,255,.16);
  --ink:#eef1f8;
  --sub:#828b9f;
  --gold:#ffc843;
  --gold2:#ff8a00;
  --vio:#8b5cf6;
  --cy:#22d3ee;
  --pink:#ff3d78;
  --disc:#5865f2;
  --disp:'Chakra Petch',sans-serif;
  --font:'Be Vietnam Pro',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:var(--font);font-size:14px;
  display:flex;justify-content:center;overflow-x:hidden;
}
.bgfx{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 620px 460px at 20% -8%, rgba(139,92,246,.20), transparent 62%),
    radial-gradient(ellipse 560px 460px at 92% 6%, rgba(255,200,67,.13), transparent 58%),
    radial-gradient(ellipse 700px 520px at 50% 108%, rgba(34,211,238,.10), transparent 62%);
}
.bgfx::after{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:40px 40px;
  mask-image:radial-gradient(ellipse 85% 65% at 50% 25%,#000 25%,transparent 100%);
  animation:drift 26s linear infinite;
}
@keyframes drift{to{background-position:40px 40px,40px 40px}}
.phone{position:relative;z-index:1;width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column}

.appbar{
  padding:16px;display:flex;align-items:center;gap:11px;
  border-bottom:1px solid var(--line);
  background:rgba(10,12,18,.75);backdrop-filter:blur(14px);
  position:sticky;top:0;z-index:20;
}
.logo{
  width:30px;height:30px;border-radius:9px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  display:grid;place-items:center;color:#150c00;
  font-family:var(--disp);font-weight:700;font-size:15px;
  box-shadow:0 0 18px rgba(255,167,10,.35);
}
.appbar .title{font-family:var(--disp);font-weight:700;font-size:15.5px;letter-spacing:.02em}
.appbar .sp{flex:1}
.appbar .link{font-size:12.5px;color:var(--sub);background:none;border:none;cursor:pointer;font-family:var(--font);padding:5px}
.appbar .link:hover{color:var(--ink)}
.content{padding:16px;flex:1}
.hidden{display:none!important}

.panel{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,var(--panel),#0b0e15);
  border:1px solid var(--line);border-radius:18px;padding:24px 20px;
}
.panel::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,200,67,.7),transparent);
}
.panel h1{font-family:var(--disp);font-size:21px;font-weight:700;margin:0 0 7px}
.lead{font-size:13px;color:var(--sub);margin:0 0 20px;line-height:1.65}
.lbl{display:block;font-size:10.5px;font-weight:700;letter-spacing:.13em;color:var(--gold);text-transform:uppercase;margin-bottom:9px}
.field{
  width:100%;background:#080a11;border:1px solid var(--line);border-radius:12px;
  padding:14px;color:var(--ink);font-family:var(--font);font-size:14px;
  outline:none;transition:border-color .18s,box-shadow .18s;
}
.field::placeholder{color:#4b5364}
.field:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,200,67,.13)}
.field.error{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,61,120,.13)}
.err{display:block;font-size:12.5px;color:var(--pink);margin-top:8px;min-height:17px}
.btn{
  width:100%;padding:14px;border:none;border-radius:12px;cursor:pointer;
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a0f00;
  font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.02em;
  box-shadow:0 8px 24px -10px rgba(255,167,10,.7);
  transition:filter .18s,transform .18s;
}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}

/* loading */
.loading{
  background:linear-gradient(180deg,var(--panel),#0b0e15);
  border:1px solid var(--line);border-radius:18px;
  padding:46px 24px 30px;text-align:center;
}
.orb{
  width:68px;height:68px;margin:0 auto 22px;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0deg,var(--gold) 130deg,var(--gold2) 250deg,transparent 360deg);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 5px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 5px));
  animation:spin .95s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.load-status{font-family:var(--disp);font-size:16px;font-weight:700;transition:opacity .2s}
.load-sub{font-size:12px;color:var(--sub);margin-top:6px;min-height:16px}
.load-track{height:4px;border-radius:3px;background:#171c27;overflow:hidden;margin-top:24px}
.load-bar{
  height:100%;width:0%;border-radius:3px;
  background:linear-gradient(90deg,var(--gold),var(--gold2));
  box-shadow:0 0 12px rgba(255,167,10,.55);
  transition:width .5s cubic-bezier(.4,0,.2,1);
}

/* profile */
.profile{
  background:linear-gradient(180deg,var(--panel2),#0c1017);
  border:1px solid var(--line);border-radius:16px;
  padding:14px;display:flex;align-items:center;gap:13px;margin-bottom:12px;
  position:relative;overflow:hidden;
}
.profile::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);
}
.av-frame{
  width:56px;height:56px;flex:0 0 auto;border-radius:14px;padding:2.5px;
  background:linear-gradient(135deg,var(--gold),var(--pink),var(--vio));
  box-shadow:0 0 18px rgba(255,167,10,.22);
}
.av-frame img{width:100%;height:100%;border-radius:11px;object-fit:cover;display:block;background:#000;border:2px solid #0b0e15}
.pinfo{flex:1;min-width:0}
.pname{
  font-family:var(--disp);font-size:16px;font-weight:700;line-height:1.2;display:inline-block;
  background:linear-gradient(92deg,#fff,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.tags{display:flex;align-items:center;gap:5px;margin-top:5px;flex-wrap:wrap}
.tg{display:inline-flex;align-items:center;gap:4px;padding:2.5px 8px;border-radius:20px;font-size:10px;font-weight:700}
.tg.intro{background:linear-gradient(135deg,#1877f2,#4f9cff);color:#fff}
.tg.owner{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a0f00}
.tg.disc{background:rgba(88,101,242,.16);color:#a3adff;border:1px solid rgba(88,101,242,.42)}
.tg svg{width:11px;height:11px}
.pid{font-family:var(--disp);font-size:11.5px;color:var(--sub);margin-top:5px}
.pturns{text-align:right;flex:0 0 auto}
.pturns .v{font-family:var(--disp);font-size:26px;font-weight:700;color:var(--gold);line-height:1}

/* discord */
.disc-card{
  display:flex;align-items:center;gap:11px;
  background:linear-gradient(135deg,rgba(88,101,242,.15),rgba(88,101,242,.05));
  border:1px solid rgba(88,101,242,.34);border-radius:14px;
  padding:11px 13px;margin-bottom:12px;
}
.disc-logo{
  width:36px;height:36px;flex:0 0 auto;border-radius:10px;
  background:var(--disc);display:grid;place-items:center;color:#fff;
  box-shadow:0 0 16px rgba(88,101,242,.4);
}
.disc-logo svg{width:20px;height:20px}
.disc-t{flex:1;min-width:0}
.disc-n{font-size:13px;font-weight:600}
.disc-h{font-family:var(--disp);font-size:11.5px;color:#a3adff;margin-top:2px}
.disc-b{
  flex:0 0 auto;background:var(--disc);border:none;border-radius:9px;
  padding:8px 13px;color:#fff;font-family:var(--font);font-size:12px;font-weight:600;
  cursor:pointer;transition:filter .18s,transform .18s;
}
.disc-b:hover{filter:brightness(1.12);transform:translateY(-1px)}

/* machine */
.wcard{
  background:linear-gradient(180deg,var(--panel),#0a0d14);
  border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative;
}
.wcard::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,200,67,.55),transparent);
}
.wtop{padding:15px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.ev-kick{font-family:var(--disp);font-size:9.5px;letter-spacing:.15em;color:var(--gold);text-transform:uppercase;margin-bottom:4px}
.ev-name{font-family:var(--disp);font-size:15px;font-weight:700}
.ev-no{font-family:var(--disp);font-size:11.5px;color:var(--sub);flex:0 0 auto}
.wbody{padding:22px 16px 18px}

.machine{
  position:relative;border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg,#0a0d14,#070910);
  border:1px solid rgba(255,200,67,.22);
  box-shadow:inset 0 0 40px rgba(0,0,0,.75);
  padding:0;
}
.machine.spinning{border-color:rgba(255,200,67,.5)}
.reel-win{position:relative;height:112px;overflow:hidden}
.reel{
  position:absolute;top:0;left:0;height:100%;
  display:flex;align-items:center;will-change:transform;
}
.cell{
  flex:0 0 auto;height:100%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-weight:700;
  border-right:1px solid rgba(255,255,255,.07);
  position:relative;
}
.cell span{
  display:block;padding:0 6px;text-align:center;
  background:linear-gradient(180deg,#fff,#c6cede);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  transition:none;
}
.cell.hi span{
  background:linear-gradient(180deg,#fff6d6,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.cell.lose span{
  background:linear-gradient(180deg,#c9d0de,#8892a6);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.cell.lose.hi span{
  background:linear-gradient(180deg,#e6ebf5,#98a2b6);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.result.miss{
  background:linear-gradient(180deg,rgba(130,139,159,.12),rgba(130,139,159,.04));
}
.result.miss.show{border-color:rgba(255,255,255,.16)}
.result.miss .r-name{
  font-size:23px;
  background:linear-gradient(92deg,#dfe5f0,#98a2b6);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.result.miss::after{display:none}
/* fade edges */
.reel-win::before,.reel-win::after{
  content:"";position:absolute;top:0;bottom:0;width:26%;z-index:3;pointer-events:none;
}
.reel-win::before{left:0;background:linear-gradient(90deg,#070910 8%,rgba(7,9,16,0))}
.reel-win::after{right:0;background:linear-gradient(270deg,#070910 8%,rgba(7,9,16,0))}
/* centre marker */
.marker{
  position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);
  width:112px;z-index:4;pointer-events:none;
  border-left:2px solid var(--gold);border-right:2px solid var(--gold);
  background:linear-gradient(180deg,rgba(255,200,67,.12),rgba(255,138,0,.05));
  box-shadow:0 0 26px rgba(255,200,67,.28) inset, 0 0 18px rgba(255,200,67,.22);
}
.marker::before,.marker::after{
  content:"";position:absolute;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;
}
.marker::before{top:0;border-top:11px solid var(--gold)}
.marker::after{bottom:0;border-bottom:11px solid var(--gold)}
.scanline{
  position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 2px,transparent 2px 5px);
  transition:opacity .3s;
}
.machine.spinning .scanline{opacity:1}

.spin-btn{
  width:100%;margin-top:18px;padding:17px;border:none;border-radius:14px;cursor:pointer;
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a0f00;
  font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.06em;
  box-shadow:0 10px 30px -12px rgba(255,167,10,.85);
  transition:filter .18s,transform .16s,box-shadow .25s;
}
.spin-btn:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 14px 34px -12px rgba(255,167,10,.95)}
.spin-btn:active:not(:disabled){transform:translateY(0) scale(.99)}
.spin-btn:disabled{
  background:#1a1f2b;color:#5d6577;cursor:default;box-shadow:none;
}
.spin-sub{text-align:center;font-size:11.5px;color:var(--sub);margin-top:9px}

/* result */
.result{
  margin-top:18px;text-align:center;position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,200,67,.09),rgba(255,138,0,.03));
  border:1px solid rgba(255,200,67,.28);border-radius:16px;
  max-height:0;opacity:0;padding:0 16px;border-color:transparent;
  transition:max-height .45s ease,opacity .35s ease,padding .45s ease,border-color .35s;
}
.result.show{max-height:240px;opacity:1;padding:18px 16px;border-color:rgba(255,200,67,.28)}
.result.show::after{
  content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.13),transparent);
  animation:sweep 1.5s ease .25s 1;
}
@keyframes sweep{to{left:120%}}
.r-kick{font-size:10.5px;letter-spacing:.14em;color:var(--sub);text-transform:uppercase}
.r-name{
  font-family:var(--disp);font-size:32px;font-weight:700;margin-top:7px;line-height:1.1;
  background:linear-gradient(92deg,var(--gold),#ffe9a8,var(--gold2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:zoom .5s cubic-bezier(.2,1.5,.4,1);
}
@keyframes zoom{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.r-desc{font-size:12px;color:var(--sub);margin-top:6px}
.code-row{display:flex;gap:8px;align-items:center;margin-top:14px}
.code-box{
  flex:1;background:#080b12;border:1px dashed rgba(255,200,67,.35);border-radius:11px;
  padding:11px 12px;color:var(--gold);font-family:var(--disp);
  font-size:13.5px;font-weight:700;letter-spacing:.06em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.copy{
  flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);border-radius:11px;
  padding:11px 14px;color:var(--ink);font-family:var(--font);font-size:12.5px;font-weight:600;cursor:pointer;
}
.copy:hover{background:#1c2230}

.blk{margin-top:16px;border-top:1px solid var(--line);padding-top:13px}
.blk-h{font-family:var(--disp);font-size:10px;letter-spacing:.14em;color:var(--sub);text-transform:uppercase;margin-bottom:9px}
.hrow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.hrow:last-child{border-bottom:none}
.hrow b{font-weight:600}
.hrow span{font-family:var(--disp);color:var(--sub);font-size:11px}

.note{font-size:11.5px;color:var(--sub);text-align:center;line-height:1.7;margin:16px 4px 26px}
.note b{color:var(--ink);font-weight:600}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);
  background:#161b26;border:1px solid var(--line2);color:var(--ink);
  font-size:13px;padding:11px 18px;border-radius:24px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:70;
  box-shadow:0 14px 40px rgba(0,0,0,.6);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
@media(prefers-reduced-motion:reduce){.bgfx::after,.orb{animation:none}}
</style>
</head>
<body>
<div class="bgfx"></div>

<div class="phone">
  <div class="appbar">
    <div class="logo">O</div>
    <div class="title">MÁY QUAY TRÚNG THƯỞNG</div>
    <div class="sp"></div>
    <button class="link hidden" id="signout">Thoát</button>
  </div>

  <div class="content">

    <div class="panel" id="gate">
      <h1>Nhập ID tài khoản</h1>
      <p class="lead">Sự kiện chỉ dành cho tài khoản đã đăng ký tại Orb.</p>
      <label class="lbl" for="idIn">ID tài khoản</label>
      <input class="field" id="idIn" type="text" autocomplete="off" spellcheck="false" placeholder="Nhập ID tài khoản của bạn">
      <span class="err" id="gateErr"></span>
      <button class="btn" id="enterBtn">Tiếp tục</button>
    </div>

    <div class="loading hidden" id="loading">
      <div class="orb"></div>
      <div class="load-status" id="loadStatus">Đang xác thực</div>
      <div class="load-sub" id="loadSub"></div>
      <div class="load-track"><div class="load-bar" id="loadBar"></div></div>
    </div>

    <div class="hidden" id="app">

      <div class="profile">
        <div class="av-frame"><img id="avatar" src="" alt=""></div>
        <div class="pinfo">
          <div class="pname" id="pname">—</div>
          <div class="tags" id="tags"></div>
          <div class="pid" id="pid">—</div>
        </div>
        <div class="pturns"><div class="v" id="turns">0</div></div>
      </div>

      <div class="disc-card">
        <div class="disc-logo">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.32 4.57A19.8 19.8 0 0 0 15.42 3c-.24.42-.5.99-.68 1.44a18.3 18.3 0 0 0-5.49 0C9.07 3.99 8.8 3.42 8.57 3a19.7 19.7 0 0 0-4.9 1.58C.55 9.2-.3 13.7.13 18.14a19.9 19.9 0 0 0 6.03 3.05c.49-.66.92-1.37 1.29-2.11-.71-.27-1.39-.6-2.03-.99.17-.12.34-.25.5-.38a14.2 14.2 0 0 0 12.16 0c.16.14.33.26.5.38-.64.39-1.32.72-2.03.99.37.74.8 1.45 1.29 2.11a19.85 19.85 0 0 0 6.04-3.05c.5-5.15-.86-9.61-3.56-13.57zM8.02 15.42c-1.18 0-2.16-1.09-2.16-2.42s.95-2.43 2.16-2.43c1.21 0 2.19 1.1 2.17 2.43 0 1.33-.96 2.42-2.17 2.42zm7.96 0c-1.18 0-2.16-1.09-2.16-2.42s.95-2.43 2.16-2.43c1.22 0 2.19 1.1 2.17 2.43 0 1.33-.95 2.42-2.17 2.42z"/></svg>
        </div>
        <div class="disc-t">
          <div class="disc-n">Discord</div>
          <div class="disc-h" id="discHandle">—</div>
        </div>
        <button class="disc-b" id="discBtn">Sao chép</button>
      </div>

      <div class="wcard">
        <div class="wtop">
          <div>
            <div class="ev-kick">Sự kiện</div>
            <div class="ev-name" id="evName">—</div>
          </div>
          <div class="ev-no" id="evNo">—</div>
        </div>

        <div class="wbody">
          <div class="machine" id="machine">
            <div class="reel-win">
              <div class="reel" id="reel"></div>
            </div>
            <div class="marker"></div>
            <div class="scanline"></div>
          </div>

          <button class="spin-btn" id="spinBtn">QUAY</button>
          <div class="spin-sub" id="spinSub">—</div>

          <div class="result" id="result">
            <div class="r-kick" id="rKick">Bạn nhận được</div>
            <div class="r-name" id="rName">—</div>
            <div class="r-desc" id="rDesc">—</div>
            <div class="code-row" id="codeRow">
              <div class="code-box" id="codeBox">—</div>
              <button class="copy" id="copyBtn">Sao chép</button>
            </div>
          </div>

          <div class="blk hidden" id="hist">
            <div class="blk-h">Quà đã nhận</div>
            <div id="histList"></div>
          </div>
        </div>
      </div>

      <div class="note">Mỗi code chỉ có thể sử dụng <b>1 lần</b> · Quà được cộng trực tiếp vào tài khoản <b id="noteAcc">—</b></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>

<script>

/* ================= MỆNH GIÁ ================= */
// Mỗi mục là một KHOẢNG tiền: trúng mục nào thì bốc ngẫu nhiên
// một số bất kỳ trong khoảng đó.
var PRIZES = [
  { lo:0,      hi:0,      w:39, lose:true },  // Không có gì?
  { lo:10000,  hi:19999,  w:30 },
  { lo:20000,  hi:49999,  w:20 },
  { lo:50000,  hi:99999,  w:10 },
  { lo:100000, hi:100999, w:1  }
  // 101.000₫ – 1.000.000₫ vẫn chạy trên băng nhưng không nằm trong
  // bảng tỉ lệ nên không bao giờ dừng vào
];
var LOSE_TEXT = "Không có gì? 😭";
var BIG = 50000; // từ mức này trở lên là quà lớn



function money(n){ return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,".") + "₫"; }
function el(id){ return document.getElementById(id); }
function pick(){
  var total=0,i;
  for(i=0;i<PRIZES.length;i++) total+=PRIZES[i].w;
  var r=Math.random()*total;
  for(i=0;i<PRIZES.length;i++){
    if(PRIZES[i].w<=0) continue;      // mệnh giá trưng bày, không thể trúng
    r-=PRIZES[i].w;
    if(r<=0) return i;
  }
  for(i=0;i<PRIZES.length;i++){ if(PRIZES[i].w>0) return i; }
  return 0;
}
function makeCode(){
  var c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789", s="ORB-";
  for(var i=0;i<8;i++){ if(i&&i%4===0) s+="-"; s+=c[Math.floor(Math.random()*c.length)]; }
  return s;
}
var tT;
function toast(m){
  var t=el('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(tT); tT=setTimeout(function(){ t.classList.remove('show'); },1900);
}
function copyText(text, ok){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(ok); })
      .catch(function(){ toast("Không sao chép được"); });
  } else toast("Không sao chép được");
}

/* ================= LOGIN ================= */
var gate=el('gate'), loading=el('loading'), app=el('app');
var idIn=el('idIn'), gateErr=el('gateErr'), account=null;

function login(){
  var raw=idIn.value.trim().toLowerCase();
  if(!raw){ fail("Bạn chưa nhập ID tài khoản."); return; }
  var key = ACCOUNTS[raw] ? raw : ALIASES[raw];
  if(!key || !ACCOUNTS[key]){ fail("ID không tồn tại hoặc chưa tham gia sự kiện."); return; }
  account=ACCOUNTS[key];
  gateErr.textContent=""; idIn.classList.remove('error');
  runLoading();
}
function fail(m){ gateErr.textContent=m; idIn.classList.add('error'); idIn.focus(); }
el('enterBtn').addEventListener('click', login);
idIn.addEventListener('keydown', function(e){ if(e.key==='Enter') login(); });
idIn.addEventListener('input', function(){ idIn.classList.remove('error'); gateErr.textContent=""; });

el('signout').addEventListener('click', function(){
  app.classList.add('hidden'); loading.classList.add('hidden');
  el('signout').classList.add('hidden'); gate.classList.remove('hidden');
  idIn.value=""; account=null; hist=[];
  el('histList').innerHTML=""; el('hist').classList.add('hidden');
  el('result').classList.remove('show');
  idIn.focus();
});

function runLoading(){
  gate.classList.add('hidden');
  loading.classList.remove('hidden');
  var bar=el('loadBar'), st=el('loadStatus'), sub=el('loadSub');
  bar.style.width="0%";
  st.textContent="Đang xác thực";
  sub.textContent=account.id;
  requestAnimationFrame(function(){ bar.style.width="55%"; });

  setTimeout(function(){
    st.style.opacity="0";
    setTimeout(function(){
      st.textContent="Đang tải...";
      sub.textContent=EVENT;
      st.style.opacity="1";
    },170);
    bar.style.width="100%";
    setTimeout(function(){ loading.classList.add('hidden'); start(); },1150);
  },1050);
}

/* ================= MÁY QUAY ================= */
var reel=el('reel'), machine=el('machine');
var CELL=112;              // bề rộng 1 ô, khớp với .marker
var STRIP=[];              // dãy chỉ số phần quà trên băng
var offset=0, spinning=false, turns=0, hist=[];

// mọi mệnh giá từ 10.000₫ đến 1.000.000₫ đều có thể xuất hiện trên băng
var MIN_V=10000, MAX_V=1000000;
function randAmount(lo, hi){
  return Math.floor(Math.random()*(hi-lo+1))+lo;
}

function makeCell(v, lose){
  return { v:v, lose:!!lose };
}

function buildStrip(){
  STRIP=[];
  var n=160, i;
  for(i=0;i<n;i++){
    // cứ vài ô lại chèn một ô "Không có gì?"
    if(i>0 && i%7===Math.floor(Math.random()*7)){
      STRIP.push(makeCell(0,true));
    } else {
      STRIP.push(makeCell(randAmount(MIN_V, MAX_V), false));
    }
  }
  // hai ô kề bên ô "Không có gì?" luôn là mệnh giá cao
  for(i=0;i<STRIP.length;i++){
    if(STRIP[i].lose){
      if(i>0)             STRIP[i-1]=makeCell(randAmount(200000, MAX_V), false);
      if(i<STRIP.length-1) STRIP[i+1]=makeCell(randAmount(200000, MAX_V), false);
    }
  }
  renderStrip();
  setOffset(CELL*4);
}

function renderStrip(){
  reel.innerHTML="";
  STRIP.forEach(function(c){
    reel.appendChild(makeCellNode(c));
  });
}

function makeCellNode(c){
  var d=document.createElement('div');
  d.className='cell'+(c.lose?' lose':'');
  d.style.width=CELL+"px";
  var sp=document.createElement('span');
  var txt=c.lose?LOSE_TEXT:money(c.v);
  sp.textContent=txt;
  sp.style.fontSize=(c.lose?15:(txt.length>9?15:19))+"px";
  sp.style.lineHeight="1.25";
  d.appendChild(sp);
  return d;
}

function setOffset(px){
  offset=px;
  var centre=machine.clientWidth/2;
  reel.style.transform="translateX("+(centre - px - CELL/2)+"px)";
  highlight();
}

function highlight(){
  var idx=Math.round(offset/CELL);
  var cells=reel.children;
  for(var i=0;i<cells.length;i++){
    if(cells[i].classList.contains('hi') && i!==idx) cells[i].classList.remove('hi');
  }
  if(cells[idx]) cells[idx].classList.add('hi');
}

function updateBtn(){
  var b=el('spinBtn'), s=el('spinSub');
  if(spinning){ b.disabled=true; b.textContent="ĐANG QUAY..."; s.textContent="Chúc bạn may mắn"; return; }
  if(turns<=0){ b.disabled=true; b.textContent="HẾT LƯỢT"; s.textContent="Bạn đã dùng hết lượt quay"; return; }
  b.disabled=false;
  b.textContent="QUAY";
  s.textContent="Còn "+turns+" lượt";
}

  if(spinning || turns<=0) return;
  spin();
});

});

function spin(){
  spinning=true;
  turns--;
  el('turns').textContent=turns;
  el('result').classList.remove('show');
  machine.classList.add('spinning');
  updateBtn();

  var prizeIdx=pick();
  var pz=PRIZES[prizeIdx];

  var from=Math.round(offset/CELL);
  var landIdx=from+38+Math.floor(Math.random()*10);

  // nếu sắp hết băng thì nối thêm ô mới vào cuối
  while(landIdx+6 >= STRIP.length){
    var c = Math.random()<0.14
      ? makeCell(0,true)
      : makeCell(randAmount(MIN_V, MAX_V), false);
    STRIP.push(c);
    reel.appendChild(makeCellNode(c));
  }

  // bốc số tiền cụ thể trong khoảng đã trúng
  var wonValue = pz.lose ? 0 : randAmount(pz.lo, pz.hi);

  // ghi kết quả vào ô sẽ dừng
  STRIP[landIdx] = pz.lose ? makeCell(0,true) : makeCell(wonValue,false);
  // hai ô kề bên: nếu trượt thì để mệnh giá cao cho tiếc
  if(pz.lose){
    STRIP[landIdx-1]=makeCell(randAmount(200000, MAX_V), false);
    STRIP[landIdx+1]=makeCell(randAmount(200000, MAX_V), false);
  }
  [landIdx-1, landIdx, landIdx+1].forEach(function(k){
    if(k>=0 && k<STRIP.length && reel.children[k]){
      reel.replaceChild(makeCellNode(STRIP[k]), reel.children[k]);
    }
  });

  var startPx=offset, endPx=landIdx*CELL;
  var dur=3800+Math.random()*700;
  var t0=performance.now();

  function ease(x){ return 1-Math.pow(1-x,4.6); }

  (function frame(now){
    var p=Math.min(1,(now-t0)/dur);
    setOffset(startPx+(endPx-startPx)*ease(p));
    if(p<1) requestAnimationFrame(frame);
    else{
      setOffset(endPx);
      spinning=false;
      machine.classList.remove('spinning');
      updateBtn();
      landed(prizeIdx, wonValue);
    }
  })(t0);
}

function landed(idx, wonValue){
  var pz=PRIZES[idx];
  var r=el('result');

  if(pz.lose){
    r.classList.add('miss');
    el('rKick').textContent="Kết quả";
    el('rName').textContent=LOSE_TEXT;
    el('rDesc').textContent = turns>0
      ? "Bạn vẫn còn "+turns+" lượt, thử tiếp nhé!"
      : "Hẹn bạn ở sự kiện lần sau nhé!";
    el('codeRow').classList.add('hidden');
    r.classList.remove('show');
    void r.offsetWidth;
    r.classList.add('show');
    hist.push({prize:LOSE_TEXT, code:"—"});
    renderHist();
    toast(LOSE_TEXT);
    return;
  }

  var v=wonValue, code=makeCode();
  r.classList.remove('miss');
  el('rKick').textContent="Bạn nhận được";
  el('rName').textContent=money(v);
  el('rDesc').textContent="Cộng thẳng vào số dư tài khoản";
  el('codeBox').textContent=code;
  el('codeRow').classList.remove('hidden');
  r.classList.remove('show');
  void r.offsetWidth;
  r.classList.add('show');
  hist.push({prize:money(v), code:code});
  renderHist();
  toast("Bạn nhận được "+money(v));
  confetti(v>=BIG);
}

function renderHist(){
  var list=el('histList'); list.innerHTML="";
  hist.forEach(function(it){
    var row=document.createElement('div'); row.className='hrow';
    var b=document.createElement('b'); b.textContent=it.prize;
    var s=document.createElement('span'); s.textContent=it.code;
    row.appendChild(b); row.appendChild(s); list.appendChild(row);
  });
  el('hist').classList.remove('hidden');
}

  copyText(txt, "Đã sao chép code");
